name: Bug
description: Signaler un comportement incorrect
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Merci pour le signalement. **Pour une faille de sécurité, n'utilise pas
        ce formulaire** : voir SECURITY.md.

        Pour un bug **dans un jeu**, ouvre l'issue sur le dépôt du jeu — ce
        dépôt-ci ne contient que le panneau d'entrée.
  - type: textarea
    id: observe
    attributes:
      label: Ce qui se passe
      description: Décris le comportement observé.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ce qui devrait se passer
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Aller sur…
        2. Cliquer sur…
        3. Observer…
    validations:
      required: true
  - type: dropdown
    id: page
    attributes:
      label: Page concernée
      options:
        - Accueil
        - À propos
        - Mentions légales
        - Confidentialité
        - Page 404
        - Plusieurs pages
    validations:
      required: true
  - type: dropdown
    id: locale
    attributes:
      label: Langue
      options: ["Français", "English", "Español", "Deutsch"]
    validations:
      required: true
  - type: dropdown
    id: theme
    attributes:
      label: Thème
      options: ["Système", "Clair", "Sombre", "Les trois"]
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Navigateur et appareil
      placeholder: Firefox 130 sur Android 14
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version affichée en bas de page
      placeholder: v1.0.0
